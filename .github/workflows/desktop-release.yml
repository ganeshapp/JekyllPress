name: Desktop release

# Builds the Linux (.deb, .tar.gz) and macOS (.dmg) downloads and attaches them
# to a GitHub release. A published release (pre-releases too, not drafts) runs
# this file as of the tagged commit; run it by hand to rebuild an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to, e.g. v2.2.0
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: ubuntu-latest moves to 26.04, whose clang likely rejects
          # flutter_secure_storage_linux's bundled json.hpp under -Werror.
          - { os: ubuntu-24.04, target: linux }
          - { os: macos-15, target: macos }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - run: flutter build ${{ matrix.target }} --release
      - run: tool/package_desktop.sh ${{ matrix.target }}

      # Proves the control file parses and Depends resolve.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y ./build/dist/*.deb

      - run: gh release upload "$TAG" build/dist/* --clobber
